[workspace]
resolver = "2"
members = [
    "crates/esp",
    "crates/esp-test-support",
    "crates/distillery",
    "crates/mesh",
]
exclude = [
    "crates/distillery/probe",
    "support/patches/burn-remote",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/distillery"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies]
wgpu = "30.0.1"
sha2 = "0.11"
# Members of this repository.
esp = { version = "0.1.0", path = "crates/esp" }
esp-testkit = { version = "0.1.0", path = "crates/esp-test-support" }
mesh = { package = "mere-mesh", version = "0.0.1", path = "crates/mesh" }
# The published contract crates Distillery produces through (Mere distillery-extraction D7).
cambium = "0.6.1"
chirograph = "0.0.4"
graphshell-endpoint = "0.0.3"
incipit = "0.2.1"
mere-surface-api = "0.1.1"
sceno = "0.0.7"
scenograph = "0.0.6"
scenomise = "0.0.7"
scenotime = "0.0.5"
# Suppliers at Mere's pins, so a Mere graph resolves one copy of each.
apparatus-core = { version = "0.1.0", git = "https://github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954", default-features = false }
armillary = { version = "0.1.1", git = "https://github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954" }
eidetic = { version = "0.0.3", default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
eidetic-search = { git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
gemot = { version = "0.1.1", git = "https://github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
identity = { package = "personae", version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
mien = { version = "0.0.1", git = "https://github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
mooting = { version = "0.1.0", git = "https://github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
muniment = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
stickleback = { version = "0.1.1", git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
tracing = "0.1"
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/murm.git", branch = "main" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

