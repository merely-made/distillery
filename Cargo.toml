[workspace]
resolver = "2"
members = [
    "crates/esp",
    "crates/esp-test-support",
    "crates/distillery",
    "crates/mesh",
    "crates/mesh/probe",
]
exclude = [
    "crates/distillery/probe",
    "support/patches/burn-remote",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/distillery"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies]
murm-sync = { version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
wgpu = "30.0.1"
sha2 = "0.11"
# Members of this repository.
esp = { version = "0.1.0", path = "crates/esp" }
esp-testkit = { version = "0.1.0", path = "crates/esp-test-support" }
mesh = { package = "mere-mesh", version = "0.0.1", path = "crates/mesh" }
# The published contract crates Distillery produces through (Mere distillery-extraction D7).
cambium = "0.6.1"
chirograph = "0.0.4"
graphshell-endpoint = "0.0.3"
incipit = "0.2.1"
mere-surface-api = "0.1.1"
sceno = "0.0.7"
scenograph = "0.0.6"
scenomise = "0.0.7"
scenotime = "0.0.5"
# Suppliers at Mere's pins, so a Mere graph resolves one copy of each.
apparatus-core = { version = "0.1.0", git = "https://github.com/merely-made/armillary.git", branch = "main", default-features = false }
armillary = { version = "0.1.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
eidetic = { version = "0.0.3", default-features = false, git = "https://github.com/merely-made/eidetic.git", branch = "main" }
eidetic-search = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
gemot = { version = "0.1.1", git = "https://github.com/merely-made/gemot.git", branch = "main" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
identity = { package = "personae", version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
mien = { version = "0.0.1", git = "https://github.com/merely-made/gemot.git", branch = "main" }
mooting = { version = "0.1.0", git = "https://github.com/merely-made/gemot.git", branch = "main" }
muniment = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { version = "0.2.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
tracing = "0.1"
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/murm.git", branch = "main" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch.crates-io]
chartulary = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
gemot = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mien = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
mooting = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
burn-remote = { path = "support/patches/burn-remote" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
esp = { path = "crates/esp" }

[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }

[patch."https://github.com/merely-made/distillery.git"]
esp = { path = "crates/esp" }
esp-testkit = { path = "crates/esp-test-support" }

