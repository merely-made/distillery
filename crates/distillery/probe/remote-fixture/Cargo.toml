[package]
rust-version = "1.97.1"
name = "distillery-remote-minilm-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Two-peer native WGPU receipt for Distillery's lease-bound Burn Remote lane."

[workspace]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["remote", "std", "wgpu"] }
burn-wgpu = { version = "=0.22.1", default-features = false, features = ["std"] }
cubecl = { version = "=0.11.1", default-features = false }
distillery = { path = "../..", features = ["remote"] }
esp = { features = ["bert"], path = "../../../esp" }
identity = { package = "personae", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
mesh = { package = "mere-mesh", path = "../../../mesh" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# A probe binary with throwaway identities, so it uses the test-only
# keypair builder (vault lock plan, ruling 96).
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main", features = ["test-identity"] }

[features]
default = []
fusion = ["burn-wgpu/fusion"]
autotune = ["burn-wgpu/autotune"]
fusion-autotune = ["fusion", "autotune"]

[workspace.package]
rust-version = "1.97.1"

# Keep the imported carrier and local actor graph on one shared leaf source.

[patch.crates-io]
cubek-reduce = { path = "../../../../support/patches/cubek-reduce" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
burn-remote = { path = "../../../../support/patches/burn-remote" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.2" }
esp = { path = "../../../esp" }

[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }

[patch."https://github.com/merely-made/distillery.git"]
esp = { path = "../../../esp" }
esp-testkit = { path = "../../../esp-test-support" }

