[package]
rust-version = "1.97.1"
name = "distillery-model-session-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Real PEFT LoRA receipt for ESP's immutable ModelSession seam."

[workspace]

[dependencies]
eidetic = { default-features = false, features = ["product"], git = "https://github.com/merely-made/eidetic.git", branch = "main" }
esp = { features = ["decoder-lora"], path = "../../../esp" }
half = "2"
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
ndarray = "0.17"
pollster = "0.4"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mere's ruled 0.11 row; a standalone workspace states it inline.
sha2 = "0.11"

[workspace.package]
rust-version = "1.97.1"

[patch.crates-io]
hodograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
esp = { path = "../../../esp" }

[patch."https://github.com/merely-made/distillery.git"]
esp = { path = "../../../esp" }
esp-testkit = { path = "../../../esp-test-support" }

