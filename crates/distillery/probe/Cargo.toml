[package]
rust-version = "1.97.1"
name = "distillery-model-probe"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/distillery"
publish = false
description = "Headed browser evidence surface for Distillery's local model corridor."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
blake3 = "1.5"
burn = { version = "=0.22.1", default-features = false, features = ["std", "wgpu"] }
eidetic = { default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
esp = { features = ["bert-validation", "bert-wgpu", "decoder-wgpu"], path = "../../esp" }
# One wasm-bindgen family with graphshell-web and cambium-genet-web-host
# (ruling 545). The old 0.2.122 pin is gone: wgpu 30.0.0 decoded a successful
# error-scope pop through `JsOption`, which wasm-bindgen 0.2.126 and later read
# as an error, and wgpu 30.0.1 decodes it through `JsNullable` instead (burn
# plan 13.37). cambium-genet-web-host's workspace wgpu requires 30.0.1.
js-sys = "=0.3.106"
muniment = { features = ["indexeddb"], git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
    "DedicatedWorkerGlobalScope",
    "Response",
] }

[workspace.package]
rust-version = "1.97.1"


[patch.crates-io]
cubek-reduce = { path = "../../../support/patches/cubek-reduce" }
armillary = { version = "0.1.1", git = "https://github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954" }
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
esp = { path = "../../esp" }


[patch."https://github.com/merely-made/retinue.git"]


[patch."https://github.com/merely-made/eidetic.git"]
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }


[patch."https://github.com/merely-made/distillery.git"]
esp = { path = "../../esp" }
esp-testkit = { path = "../../esp-test-support" }


[patch."https://github.com/merely-made/armillary.git"]
armillary = { version = "0.1.1", git = "https://www.github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954" }
