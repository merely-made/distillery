[package]
rust-version = "1.97.1"
name = "mere-athanor"
version = "0.0.1"
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
description = "Athanor is the distillation furnace of Distillery, the Mere platform's works: Alembic's workshop folded in (records, surface and native host behind `workshop`, `workshop-surface`, `workshop-native`) and its authority half — what a furnace pass is, what it may propose (distillation, cleanup, facet proposals), and the grants, runs, petitions, and revocation over bounded actors. It proposes and never becomes graph-truth authority; Djinn schedules it as one resident service."
readme = "README.md"
keywords = ["memory", "agents", "distillation", "automation", "local-first"]
categories = ["development-tools"]

[lib]
name = "athanor"
path = "src/lib.rs"

[features]
default = []
workshop = ["dep:servitor", "dep:muniment", "dep:serde", "dep:serde_json", "dep:blake3"]
workshop-surface = ["workshop", "dep:cambium"]
workshop-native = ["workshop-surface", "dep:cambium-desktop"]
workshop-worker = ["workshop", "dep:armillary"]
workshop-sealed = ["workshop", "dep:eidetic"]
workshop-destination = ["workshop", "dep:pandect", "dep:kernel", "dep:chartulary", "dep:euclid", "dep:uuid"]

[dependencies]
cambium = { workspace = true, optional = true }
eidetic = { workspace = true, optional = true }
kernel = { workspace = true, optional = true }
pandect = { workspace = true, optional = true }
servitor = { workspace = true, optional = true }
muniment = { workspace = true, optional = true }
armillary = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
blake3 = { version = "1", optional = true }
chartulary = { workspace = true, optional = true }
euclid = { version = "0.22", optional = true }
uuid = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cambium-desktop = { workspace = true, optional = true }

[dev-dependencies]
chacha20poly1305 = "=0.10.1"
async-trait = "0.1"
muniment = { workspace = true, features = ["directory"] }
pollster = "0.4"
serde_json = "1"
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
taproot.workspace = true

[lints]
workspace = true

# Athanor's own workspace root (engine split P3 slice 4, F1): it names the host
# toolkit from graphshell.git, so it sits outside Distillery's main root, which
# names no host crate (the device Graphshell uses for host/ beside its contract
# root). Family rows are branch = "main" (engine split D66).
[workspace]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/merely-made/distillery"

[workspace.dependencies]
cambium = { version = "0.6.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium-desktop = { version = "0.1.0", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
kernel = { package = "mere-kernel", version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
pandect = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
eidetic = { version = "0.0.3", default-features = false, features = ["product"], git = "https://github.com/merely-made/eidetic.git", branch = "main" }
servitor = { version = "0.0.3", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
chartulary = { version = "0.3.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
armillary = { version = "0.1.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["accesskit"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch.crates-io]
# Dramatis (sporran, gaz) takes eidetic and muniment from crates.io so it never pins
# the family; these rows swap in the git source this root names, so the graph holds
# one copy of each and their types agree (as in Mere's and Graphshell's host roots).
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
