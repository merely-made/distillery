[package]
rust-version = "1.97.1"
name = "esp"
version = "0.1.0"
edition = "2024"
description = "Portable inference and embedding seams for local, browser, and remote model execution."
repository = "https://github.com/merely-made/distillery"
readme = "README.md"
keywords = [
    "inference",
    "embeddings",
    "local",
    "webgpu",
    "retrieval",
]
categories = [
    "science",
    "api-bindings",
    "data-structures",
]

[package.license]
workspace = true

[dependencies]
zeroize = "1"

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.eidetic]
workspace = true
optional = true

[dependencies.armillary]
workspace = true
optional = true

[dependencies.eidetic-search]
workspace = true
optional = true

[dependencies.burn]
version = "=0.23.0-pre.2"
default-features = false
features = [
    "flex",
    "std",
]
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.minijinja]
version = "3.1"
optional = true
features = [
    "json",
    "loop_controls",
    "fuel",
    "serde",
]

[dependencies.minijinja-contrib]
version = "3.1"
optional = true
features = [
    "pycompat",
]

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.safetensors]
version = "0.8"
optional = true

[dependencies.half]
version = "2"
optional = true

[dependencies.pytorch-reader]
version = "0.23.0-pre.2"
optional = true

[dependencies.serde_yaml_ng]
version = "0.10"
optional = true

[dependencies.realfft]
version = "3.5"
optional = true

[dependencies.thiserror]
version = "2"
optional = true

[dependencies.wgpu]
workspace = true
optional = true

[dependencies.pollster]
version = "1"
optional = true

[target."cfg(not(all(target_family = \"wasm\", target_os = \"unknown\")))".dependencies.tokenizers]
version = "0.23"
default-features = false
features = [
    "onig",
]
optional = true

[target."cfg(all(target_family = \"wasm\", target_os = \"unknown\"))".dependencies.tokenizers]
version = "0.23"
default-features = false
features = [
    "unstable_wasm",
]
optional = true

[target."cfg(all(target_family = \"wasm\", target_os = \"unknown\"))".dependencies.getrandom]
version = "0.4"
features = [
    "wasm_js",
]
optional = true

[dev-dependencies]
anyhow = "1"
esp-testkit = { path = "../esp-test-support" }
serde_json = "1"
pollster = "1"
async-trait = "0.1"
tempfile = "3"

[dev-dependencies.eidetic]
workspace = true

[dev-dependencies.eidetic-search]
workspace = true

[dev-dependencies.muniment]
workspace = true
features = [
    "redb",
    "fjall",
]

[dev-dependencies.sha2]
workspace = true

[features]
default = []
actor = [
    "dep:armillary",
]
decoder = [
    "dep:burn",
    "dep:serde_json",
    "dep:safetensors",
    "dep:half",
    "dep:tokenizers",
    "dep:tracing",
    "dep:getrandom",
]
decoder-flex = [
    "decoder",
    "burn/flex",
]
decoder-wgpu = [
    "decoder",
    "burn/wgpu",
    "dep:wgpu",
    "dep:pollster",
]
decoder-lora = [
    "decoder",
    "model-session",
]
decoder-autodiff = [
    "decoder-lora",
    "burn/autodiff",
    "burn/optim",
]
persistence = [
    "dep:eidetic",
]
# JSON Schema compiled into `OutputGrammar` (decision-driver D7). No model
# runtime: the compiler and its validator only.
output-schema = [
    "dep:serde_json",
]
# A model's own Jinja chat template, rendered by minijinja (decision-driver D8).
# Opt-in per model; no model runtime.
chat-template = [
    "dep:minijinja",
    "dep:minijinja-contrib",
    "dep:serde_json",
]
# The `GoalEmbedder` adapter over an ESP provider (D2 of Mere's cycle breaks plan):
# `eidetic-search` keeps only the trait, ESP implements it.
goal-model = [
    "persistence",
    "dep:eidetic-search",
]
recall-example = [
    "goal-model",
    "bert",
    "bert-wgpu",
]
model-session = [
    "persistence",
    "dep:serde_json",
]
index-burn = [
    "dep:burn",
    "dep:getrandom",
]
index-burn-wgpu = [
    "index-burn",
    "burn/wgpu",
]
bert = [
    "dep:burn",
    "dep:tokenizers",
    "dep:safetensors",
    "dep:serde_json",
    "dep:half",
    "dep:getrandom",
]
bert-wgpu = [
    "bert",
    "burn/wgpu",
]
bert-validation = [
    "bert",
]
audio-separation = [
    "dep:burn",
    "dep:safetensors",
    "dep:half",
    "dep:pytorch-reader",
    "dep:serde_yaml_ng",
    "dep:realfft",
    "dep:thiserror",
    "dep:serde_json",
    "dep:getrandom",
]
audio-separation-wgpu = [
    "audio-separation",
    "burn/wgpu",
]

[[example]]
name = "eidetic-recall"
test = true
required-features = [
    "recall-example",
]

[[test]]
name = "separation_parity"
required-features = [
    "audio-separation",
]

[[test]]
name = "goal_model_minilm"
required-features = [
    "goal-model",
    "bert",
]

[[example]]
name = "import_inference_model"
required-features = [
    "decoder",
    "model-session",
]

[[example]]
name = "qualify_inference_model"
required-features = [
    "decoder",
    "model-session",
]

[[test]]
name = "library_session"
required-features = [
    "decoder",
    "model-session",
]

[[test]]
name = "smollm2_library"
required-features = [
    "decoder",
    "model-session",
]

[lints]
workspace = true
