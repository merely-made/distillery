# The M2d cross-target determinism receipt: compile the *same*
# `lexical_codec.rs` source the mesh's `esp.embed.lexical/v1` adapter uses to
# wasm32-unknown-unknown, run it under Node's WebAssembly engine, and print the
# blake3 digest of its canonical output. Matching the native digest is what
# earns `VerificationClass::ExactBytes`; a mismatch means the class must drop to
# an explicit tolerance.
#
# A member of the Distillery workspace. Run with `run.ps1`.
[package]
rust-version = "1.97.1"
name = "mesh-lexical-wasm"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
esp.workspace = true
blake3 = "1.5"
thiserror = "2"

[lints]
workspace = true
