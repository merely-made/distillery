[package]
rust-version = "1.97.1"
name = "mere-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The personal-space compute mesh: signed job operations over the LogSync event-DAG, a deterministic job board, and the worker loop. Resource-coordination milestone 1 (own devices, no economy)."

[lib]
name = "mesh"
path = "src/lib.rs"

[features]
admitted-ingress = ["dep:transport", "dep:notochord", "dep:serde_json", "tokio/io-util", "tokio/sync", "tokio/macros"]

[dependencies]
murm-sync.workspace = true
transport = { workspace = true, features = ["notochord"], optional = true }
notochord = { workspace = true, features = ["tokio"], optional = true }
serde_json = { version = "1", optional = true }
insigne = { workspace = true, features = ["verify"] }
# The operation/signing substrate the job ops ride (the same signed
# Operation<Ext> wire as Standing and Murm posts; mirrors Gemot's pin).
p2panda-core = { package = "p2mere-core", version = "0.10" }
# Persona-derived signing keys (the same identity flow Standing's wire uses).
identity = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
blake3 = "1.5"
proofs.workspace = true
# The three sync traits LogSync reconciles against (`LogStore` + `TopicStore`,
# plus `OperationStore`). Default features off: the mesh brings muniment through
# `stickleback`'s `MunimentStore`, not p2panda-store's bundled SQLite
# backend. (This said "the mooting adapter" until 2026-07-26; mooting stopped
# being a mesh dependency when the shared store moved to stickleback.)
p2panda-store = { package = "p2mere-store", version = "0.10", default-features = false }
# Shared validated operation store; live sync belongs to murm-sync.
stickleback = { workspace = true }
muniment = { workspace = true, features = ["redb"] }
# The sync lane uses murm-sync's JoinedSpace over the domain store and
# host-injected Endpoint/Gossip handles. It creates no endpoint and declares
# no p2panda-net features. `rt` runs sessions; `time` bounds manual resync.
tokio = { version = "1", features = ["rt", "time"] }
# The embedding behaviour behind `esp.embed.lexical/v1`. Default features: the
# lexical provider is pure Rust, so the mesh pulls in no Burn, GPU, weights, or
# tokenizer assets to ship its first useful resource.
esp = { workspace = true }

[dev-dependencies]
# `transport` builds the real p2panda-net peers for
# the two-peer convergence test and the `mesh-peer` example bin. `macros` +
# `rt-multi-thread` run the async tests; `io-std`/`io-util` read pasted peer
# tickets in the example; tempfile backs the file-store reopen test.
# `test-identity`: tests and examples bind throwaway identities (vault lock
# plan, ruling 96).
transport = { workspace = true, features = ["test-identity"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "io-std", "io-util", "process", "test-util"] }
tempfile = "3"
serde_json = "1"
toml = "0.9"

[[example]]
name = "inventory_ingress"
path = "examples/inventory_ingress/main.rs"
required-features = ["admitted-ingress"]
